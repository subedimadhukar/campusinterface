name: Lighthouse

# Performance and accessibility budgets (lighthouserc.json) on the academy
# home, the course archive, a single course and a lesson, measured as a
# visitor, and on the student dashboard, measured logged in as the seeded
# learner (a second, additive collect with a Cookie header), with Public LMS
# and its demo data. Public LMS lives in its own public repository, which the
# job checks out beside the theme; no secret is needed. If the repository or
# the PUBLIC_LMS_REF branch cannot be reached, the Lighthouse job is skipped,
# not failed. An optional PUBLIC_LMS_TOKEN secret is used when set.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PUBLIC_LMS_REPOSITORY: subedimadhukar/public-lms
  PUBLIC_LMS_REF: ${{ vars.PUBLIC_LMS_REF || 'main' }}

jobs:
  plugin:
    name: Check Public LMS is reachable
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.probe.outputs.available }}
    steps:
      - name: Look for the plugin repository
        id: probe
        env:
          TOKEN: ${{ secrets.PUBLIC_LMS_TOKEN }}
        run: |
          url="https://github.com/${PUBLIC_LMS_REPOSITORY}.git"
          if [ -n "$TOKEN" ]; then
            url="https://x-access-token:${TOKEN}@github.com/${PUBLIC_LMS_REPOSITORY}.git"
          fi
          if GIT_TERMINAL_PROMPT=0 git ls-remote --exit-code "$url" "$PUBLIC_LMS_REF" > /dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Lighthouse skipped::${PUBLIC_LMS_REPOSITORY}@${PUBLIC_LMS_REF} is not reachable from this run. Check the repository name and the PUBLIC_LMS_REF variable."
            {
              echo "### Lighthouse skipped"
              echo
              echo "Public LMS (\`${PUBLIC_LMS_REPOSITORY}@${PUBLIC_LMS_REF}\`) is not reachable from this run, so the budgets were not measured."
              echo "Check the repository name in the workflow and the \`PUBLIC_LMS_REF\` variable."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  lighthouse:
    name: Lighthouse budgets
    needs: plugin
    if: needs.plugin.outputs.available == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: campusinterface

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.PUBLIC_LMS_REPOSITORY }}
          ref: ${{ env.PUBLIC_LMS_REF }}
          token: ${{ secrets.PUBLIC_LMS_TOKEN || github.token }}
          path: public-lms

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none
          tools: composer:v2

      - name: Install the plugin's Composer dependencies
        working-directory: public-lms
        run: composer install --no-dev --prefer-dist --no-interaction

      - uses: actions/setup-node@v4
        with:
          node-version-file: public-lms/.nvmrc
          cache: npm
          cache-dependency-path: public-lms/package-lock.json

      - name: Build the plugin
        working-directory: public-lms
        run: |
          npm ci
          npm run build

      # Only the plugin under test: no Theme Check or Polylang, and no debug
      # logging, so the pages are measured as a visitor would get them.
      - name: Start WordPress with the theme and Public LMS
        working-directory: campusinterface
        run: |
          echo '{ "plugins": [ "../public-lms" ], "config": { "WP_DEBUG": false, "WP_DEBUG_LOG": false } }' > .wp-env.override.json
          npx --yes @wordpress/env@12 start

      - name: Seed demo content
        working-directory: campusinterface
        run: bin/lighthouse-seed.sh

      # The public pages from lighthouserc.json as a visitor, then the
      # dashboard logged in, added to the same results; the reports are
      # written before the budgets are asserted, so they are kept on failure.
      - name: Run Lighthouse CI
        working-directory: campusinterface
        run: |
          npx --yes @lhci/cli@0.15.1 collect
          npx --yes @lhci/cli@0.15.1 collect --additive \
            --url=http://localhost:8888/my-learning/ \
            --settings.extraHeaders="$(bin/lighthouse-learner-cookie.sh)"
          npx --yes @lhci/cli@0.15.1 upload
          npx --yes @lhci/cli@0.15.1 assert

      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: campusinterface/.lighthouseci/
          if-no-files-found: ignore
