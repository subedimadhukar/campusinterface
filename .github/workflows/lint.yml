name: Lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  phpcs:
    name: PHPCS and palette contrast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none
          tools: composer:v2, cs2pr
      - uses: ramsey/composer-install@v3
      - name: Run PHPCS
        run: vendor/bin/phpcs -q --report=checkstyle | cs2pr
      - name: Check WCAG AA contrast of every palette
        run: composer contrast

  rtl:
    name: Right-to-left stylesheets are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      # Every -rtl.css file is generated by rtlcss from its source; a source
      # changed without `npm run rtl` leaves a stale copy and fails here.
      - name: Regenerate the RTL stylesheets and compare
        run: |
          npm ci
          npm run rtl
          git diff --exit-code
